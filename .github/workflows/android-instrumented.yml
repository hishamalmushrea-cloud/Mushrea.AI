name: Android Instrumented (emulator)

# The repository's instrumented tests (23 tests in 9 files) were written but never executed:
# every workflow so far only *compiled* them (android.yml runs assembleGithubDebugAndroidTest,
# which proves the test sources compile, not that they pass). docs/development/FEATURE_MATRIX.md
# records this honestly - "written and only compiled, never run, and not to be counted as
# successful by inference" - and it is the largest remaining proof gap in the project.
#
# This workflow closes that gap on a free hosted emulator, so a device test can no longer rot
# unnoticed. It is CI-only: it does not touch the app's behaviour, the release build, or the
# published artifacts.
#
# Why both flavors:
#   * fdroid - no Firebase at all (the google-services/crashlytics plugins are skipped by
#     -Pmushreacode.fdroidBuild=true, and app/src/fdroid ships no-op analytics/crash reporters).
#     Deterministic: no Firebase init, no network at launch.
#   * github - the flavor the release pipeline builds and signs, with the real dependency set.
#     A test that passes on fdroid but fails on github is a real defect, not noise.
#
# The emulator is a plain x86_64 AVD. It is NOT a real device: no PRoot rootfs, no Termux, no
# microphone, no hardware agent. A test that needs those must stay in the manual device matrix
# (docs/device-matrix.md) and must not be counted as covered by this workflow.
#
# Note on the failure surface: this repository's CI is read through the check-run annotations
# API, because the job-log endpoint is not retrievable with the bot account. Every step that can
# fail therefore ends by printing the relevant lines as ::error:: annotations, the same way
# android.yml does for detekt, lint and unit-test failures.

on:
  push:
    branches: ['arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-instrumented-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented:
    name: ${{ matrix.label }} (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # One flavor failing must not cancel the other: the two runs are independent evidence.
      fail-fast: false
      matrix:
        include:
          - flavor: fdroid
            label: connectedFdroidDebugAndroidTest
            task: ':app:connectedFdroidDebugAndroidTest'
            gradleFlag: '-Pmushreacode.fdroidBuild=true'
          - flavor: github
            label: connectedGithubDebugAndroidTest
            task: ':app:connectedGithubDebugAndroidTest'
            gradleFlag: ''
    env:
      GITHUB_CLIENT_ID: ${{ vars.AND_CODE_GITHUB_CLIENT_ID }}
      FLAVOR: ${{ matrix.flavor }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache generated Android runtime
        uses: actions/cache@v4
        with:
          path: |
            build/generated/runtime-assets
            build/generated/runtime-jni
          key: mushrea-code-runtime-${{ runner.os }}-${{ hashFiles('runtime_tools/termux_assets.lock.json', 'runtime_tools/termux_assets.py', 'scripts/prepare_android_runtime_*.py') }}

      # The runtime assets are fetched from the Termux mirrors by the Gradle build itself
      # (preBuild -> prepareOpenCodeRuntimeNativeLibs -> prepareOpenCodeRuntimeAssets). The
      # repository has no saved cache for it yet (actions/caches reports total_count 0), so every
      # run fetches the pinned .deb files. The Gradle log below therefore carries the download
      # failure too, and no separate download is run here: a second concurrent fetch of the same
      # mirrors is what makes a rate-limited mirror fail.

      - name: Report free disk space
        run: |
          df -h / /mnt 2>/dev/null | while IFS= read -r line; do
            echo "::notice::disk: $line"
          done

      - name: Run instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          emulator-boot-timeout: 900
          # The action runs a few `adb shell` calls of its own right after the boot and does not
          # guard them, so an emulator that is slow to settle aborts the step. The equivalent
          # calls are made inside the script below, where a failure is tolerated.
          disable-animations: false
          disable-spellchecker: false
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -gpu swiftshader_indirect
          # The action splits the script on newlines and runs each line as its own `sh -c`, so
          # this must stay a single line: a multi-line `if ... then ... fi` would be run as two
          # broken fragments and fail with a shell syntax error.
          script: adb shell input keyevent 82 || true; adb shell settings put global window_animation_scale 0.0 || true; adb shell settings put global transition_animation_scale 0.0 || true; adb shell settings put global animator_duration_scale 0.0 || true; if ! ./gradlew ${{ matrix.task }} ${{ matrix.gradleFlag }} --stacktrace > /tmp/instrumented.log 2>&1; then tail -150 /tmp/instrumented.log; exit 1; fi; tail -40 /tmp/instrumented.log

      - name: Surface the build failure
        if: failure()
        run: |
          echo "::error::build: the instrumented run failed before or during the test phase"
          if [ -f /tmp/instrumented.log ]; then
            grep -E "^e: file://|What went wrong|Execution failed for task|Caused by:|FAILURE:|Traceback|URLError|HTTPError|urlopen|error: |OutOfMemory|No space left|Could not (download|resolve|find)|Locked Termux package archive unavailable" /tmp/instrumented.log | head -18 | while IFS= read -r line; do
              echo "::error::build: $line"
            done
            echo "--- last 40 lines ---"
            tail -40 /tmp/instrumented.log | while IFS= read -r line; do
              echo "::error::build-log: $line"
            done
          else
            echo "::error::build: no instrumented log was produced (the emulator step did not reach Gradle)"
          fi

      - name: Surface the test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, re

          files = glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True)
          files += glob.glob('app/build/test-results/**/*.xml', recursive=True)
          total = failed = skipped = 0
          for f in sorted(set(files)):
              try:
                  s = open(f, encoding='utf-8', errors='replace').read()
              except OSError:
                  continue
              m = re.search(r'<testsuite[^>]*tests="(\d+)"[^>]*failures="(\d+)"[^>]*errors="(\d+)"[^>]*skipped="(\d+)"', s)
              if m:
                  total += int(m.group(1)); failed += int(m.group(2)) + int(m.group(3)); skipped += int(m.group(4))
              for name, msg in re.findall(r'<testcase[^>]*name="([^"]+)"[^>]*>\s*<(?:failure|error)[^>]*message="([^"]*)"', s):
                  print(f"::error::test: {os.path.basename(f)} :: {name} :: {msg[:300]}")
          print(f"::notice::tests: {total} test(s), {failed} failed, {skipped} skipped, {len(set(files))} report file(s)")
          PY

      - name: Upload the instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-report-${{ matrix.flavor }}
          path: |
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
            /tmp/instrumented.log
          if-no-files-found: ignore
          retention-days: 14
