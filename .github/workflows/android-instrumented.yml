name: Android Instrumented (emulator)

# The repository's instrumented tests (23 tests in 9 files) were written but never executed:
# every workflow so far only *compiled* them (android.yml runs assembleGithubDebugAndroidTest,
# which proves the test sources compile, not that they pass). docs/development/FEATURE_MATRIX.md
# records this honestly - "written and only compiled, never run, and not to be counted as
# successful by inference" - and it is the largest remaining proof gap in the project.
#
# This workflow closes that gap on a free hosted emulator, so a device test can no longer rot
# unnoticed. It is CI-only: it does not touch the app's behaviour, the release build, or the
# published artifacts.
#
# Why both flavors:
#   * fdroid - no Firebase at all (the google-services/crashlytics plugins are skipped by
#     -Pmushreacode.fdroidBuild=true, and app/src/fdroid ships no-op analytics/crash reporters).
#     Deterministic: no Firebase init, no network at launch.
#   * github - the flavor the release pipeline builds and signs, with the real dependency set.
#     A test that passes on fdroid but fails on github is a real defect, not noise.
#
# The emulator is a plain x86_64 AVD. It is NOT a real device: no PRoot rootfs, no Termux, no
# microphone, no hardware agent. A test that needs those must stay in the manual device matrix
# (docs/device-matrix.md) and must not be counted as covered by this workflow.
#
# Note on the failure surface: this repository's CI is read through the check-run annotations
# API, because the job-log endpoint is not retrievable with the bot account. Every step that can
# fail therefore ends by printing the relevant lines as ::error:: annotations, the same way
# android.yml does for detekt, lint and unit-test failures.

on:
  push:
    branches: ['arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-instrumented-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented:
    name: ${{ matrix.label }} (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # One flavor failing must not cancel the other: the two runs are independent evidence.
      fail-fast: false
      # The two legs must not run at the same time. Both build the app, and the app's build
      # fetches the pinned Termux .deb files from the public mirrors (the repository has no
      # saved cache for them: actions/caches reports total_count 0). Two legs fetching the same
      # files at once is what makes a rate-limited mirror fail, and the second leg then reuses
      # the cache the first one saved.
      max-parallel: 1
      matrix:
        include:
          - flavor: fdroid
            label: connectedFdroidDebugAndroidTest
            task: ':app:connectedFdroidDebugAndroidTest'
            assemble: ':app:assembleFdroidDebug'
            assembleTest: ':app:assembleFdroidDebugAndroidTest'
            gradleFlag: '-Pmushreacode.fdroidBuild=true'
          - flavor: github
            label: connectedGithubDebugAndroidTest
            task: ':app:connectedGithubDebugAndroidTest'
            assemble: ':app:assembleGithubDebug'
            assembleTest: ':app:assembleGithubDebugAndroidTest'
            gradleFlag: ''
    env:
      GITHUB_CLIENT_ID: ${{ vars.AND_CODE_GITHUB_CLIENT_ID }}
      FLAVOR: ${{ matrix.flavor }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache generated Android runtime
        uses: actions/cache@v4
        with:
          path: |
            build/generated/runtime-assets
            build/generated/runtime-jni
          # A key of its own, deliberately. The step below can refresh the pinned Termux
          # packages, and a cache shared with android.yml would then hand a refreshed binary to
          # the release build under the original lock's hash. The instrumented workflow must not
          # be able to influence what a release packages.
          key: instrumented-runtime-${{ runner.os }}-${{ hashFiles('runtime_tools/termux_assets.lock.json', 'runtime_tools/termux_assets.py', 'scripts/prepare_android_runtime_*.py') }}

      # The runtime assets are fetched from the Termux mirrors by the Gradle build itself
      # (preBuild -> prepareOpenCodeRuntimeNativeLibs -> prepareOpenCodeRuntimeAssets), and
      # every package is verified against the SHA-256 the official Termux index publishes.
      # A pinned version that upstream has rotated out is a failure, not something to paper
      # over: the build is expected to fail here until the lock in the repository is
      # refreshed and committed.
      - name: Confirm the pinned runtime assets are available
        run: |
          if ! python3 scripts/prepare_android_runtime_assets.py --output-dir build/generated/runtime-assets --lock-file runtime_tools/termux_assets.lock.json > /tmp/assets.log 2>&1; then
            echo "::error::assets: the pinned Termux packages are not available; the lock in the repository has to be refreshed and committed"
            grep -E "Failed to download Termux path|HTTP Error 404|SHA256 mismatch" /tmp/assets.log | head -4 | while IFS= read -r line; do
              echo "::error::assets: $line"
            done
            exit 1
          fi
          echo "the pinned Termux packages are available and verified"

      - name: Report free disk space
        run: |
          df -h / /mnt 2>/dev/null | while IFS= read -r line; do
            echo "::notice::disk: $line"
          done

      # The build is done before the emulator starts, on purpose. The connected-test task
      # builds the app and the test APK itself, and running that inside the emulator step put
      # the Kotlin and dex build on the same four vCPUs as the x86_64 emulator, at the same
      # time. The emulator's own system_server then blocked for fifteen seconds and its
      # watchdog fired, and the app process was starved with it: the system killed it for a
      # background ANR, which the instrumentation reports as "Process crashed". Nothing about
      # the app was wrong; the machine was too busy. With the build done up front the
      # connected-test task finds everything up to date and the emulator has the host to itself.
      - name: Build the app and the test APK before the emulator starts
        run: |
          ./gradlew ${{ matrix.assemble }} ${{ matrix.assembleTest }} ${{ matrix.gradleFlag }} --stacktrace

      - name: Run instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Android 11, not Android 15. The first boot of an Android 15 image keeps the whole
          # guest busy for a long time - the launcher, the phone app, the safety centre, the
          # permission controller, the media provider - and the app under test has to load and
          # verify its own dex while all of that is running. The guest's own CPU pressure was
          # 90% during the run, and the app got 14% of it, which is not enough to finish
          # opening a debug dex before the platform's startup timeout expires. The older image
          # has far less first-boot work to do. The app's minSdk is 26, so it is supported.
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_6
          # Four cores, the whole hosted runner. The build is done before the emulator starts,
          # so the guest is not sharing the machine with a Kotlin compile any more.
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          emulator-boot-timeout: 900
          # The action runs a few `adb shell` calls of its own right after the boot and does not
          # guard them, so an emulator that is slow to settle aborts the step. The equivalent
          # calls are made inside the script below, where a failure is tolerated.
          disable-animations: false
          disable-spellchecker: false
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -gpu swiftshader_indirect
          # The action splits the script on newlines and runs each line as its own `sh -c`, so
          # this must stay a single line: a multi-line `if ... then ... fi` would be run as two
          # broken fragments and fail with a shell syntax error.
          # The build is retried twice because its first action is a network fetch from the
          # public Termux mirrors, and a mirror that rate-limits is worth one more attempt.
          #
          # After a failed attempt the app's dex is compiled ahead of time with "pm compile".
          # The main thread of the app was caught inside DexFileVerifier::Verify while it was
          # opening its own dex, which is what a debug build does on every start: nothing
          # pre-compiles it, so the whole dex is verified at run time, and on an emulator that
          # is slow enough to miss the platform's startup timeout. An ahead-of-time compiled
          # dex is loaded instead of verified, and the next attempt starts in time.
          #
          # The logcat is cleared before every attempt, so the capture that follows holds the
          # test window and nothing else. Without that, the emulator's own boot-time crashes
          # (com.android.phone, com.android.settings, com.android.systemui and friends, all of
          # them minutes old) push the app's crash out of the capture, and the diagnosis reads
          # the wrong crash. The crash buffer is captured separately because a native crash
          # (SIGSEGV/SIGABRT) is written there and nowhere else, and the dropbox is captured
          # because it survives the ring buffer rotating.
          script: >-
            adb shell input keyevent 82 || true; adb shell settings put global window_animation_scale 0.0 || true; adb shell settings put global transition_animation_scale 0.0 || true; adb shell settings put global animator_duration_scale 0.0 || true; for i in $(seq 1 40); do p=$(adb shell cat /proc/pressure/cpu 2>/dev/null | tr -d '\r' | awk '/^some/{split($2,a,"="); print a[2]; exit}'); [ -n "$p" ] || p=0; echo "settle sample $i: guest cpu some avg10=$p" >> /tmp/settle.txt; echo "::notice::settle: sample $i, guest cpu some avg10=$p"; if awk -v v="$p" 'BEGIN{exit !(v<25)}'; then break; fi; sleep 15; done; echo "::notice::settle: the emulator is left alone for 30s after the guest went quiet"; sleep 30; rc=1; for i in 1 2 3; do adb logcat -c > /dev/null 2>&1 || true; if ./gradlew ${{ matrix.task }} ${{ matrix.gradleFlag }} --stacktrace > /tmp/instrumented.log 2>&1; then rc=0; break; fi; adb logcat -b all -d -v threadtime > /tmp/logcat-attempt-$i.txt 2>&1 || true; echo "gradle attempt $i failed"; for p in $(adb shell pm list packages 2>/dev/null | tr -d '\r' | sed 's/^package://' | grep '^com.mushrea.code'); do echo "compiling $p" >> /tmp/compile.txt; adb shell pm compile -m speed "$p" >> /tmp/compile.txt 2>&1 || true; done; sleep 25; done; adb logcat -b all -d -v threadtime > /tmp/logcat.txt 2>&1 || true; adb logcat -b crash -d -v threadtime > /tmp/logcat-crash.txt 2>&1 || true; adb shell dumpsys dropbox --print > /tmp/dropbox.txt 2>&1 || true; adb shell dumpsys activity lastanr > /tmp/lastanr.txt 2>&1 || true; tail -150 /tmp/instrumented.log; exit $rc

      - name: Surface the build failure
        if: failure()
        run: |
          echo "::error::build: the instrumented run failed before or during the test phase"
          if [ -f /tmp/instrumented.log ]; then
            grep -E "^e: file://|What went wrong|Execution failed for task|Caused by:|FAILURE:|Traceback|URLError|HTTPError|urlopen|error: |OutOfMemory|No space left|Could not (download|resolve|find)|Failed to download Termux path|Locked Termux package archive unavailable" /tmp/instrumented.log | head -18 | while IFS= read -r line; do
              echo "::error::build: $line"
            done
            echo "--- the python traceback, if the failure was in the runtime-asset script ---"
            grep -A 14 "Traceback (most recent call last):" /tmp/instrumented.log | head -18 | while IFS= read -r line; do
              echo "::error::build-traceback: $line"
            done
            echo "--- last 30 lines ---"
            tail -30 /tmp/instrumented.log | while IFS= read -r line; do
              echo "::error::build-log: $line"
            done
          else
            echo "::error::build: no instrumented log was produced (the emulator step did not reach Gradle)"
          fi

      # GitHub keeps at most ten annotations per step, so the crash itself is extracted in
      # its own step and everything else is printed after it.
      # GitHub keeps at most ten annotations per step, so the crash itself is extracted in
      # its own step and everything else is printed after it.
      #
      # The extraction is targeted rather than "the first N crashes". The emulator crashes in
      # its own system apps while it settles, and those crashes are not the bug: a report that
      # lists three of them and stops is a report about the emulator, not about the app. What
      # matters is the crash of com.mushrea.code, whatever form it takes - a Java exception, a
      # native signal, or the process being killed outright.
      - name: Surface the app crash
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re

          def read(path):
              try:
                  with open(path, encoding='utf-8', errors='replace') as handle:
                      return handle.read()
              except Exception:
                  return ''

          # A crash block runs from a "FATAL EXCEPTION" line up to the next one, so the whole
          # stack trace is kept. Cutting it at the next timestamped line would keep the first
          # line of the stack and throw the rest away, which is where the cause lives.
          FATAL = re.compile(r'FATAL EXCEPTION[^\n]*\n(.*?)(?=\S*\s*FATAL EXCEPTION|\Z)', re.S)

          paths = ['/tmp/logcat.txt', '/tmp/logcat-crash.txt'] + sorted(glob.glob('/tmp/logcat-attempt-*.txt'))
          for path in paths:
              raw = read(path)
              if not raw.strip():
                  print(f"::notice::logcat: {path} is empty or missing")
                  continue
              lines = raw.splitlines()
              stamps = [l[:18] for l in lines if re.match(r'^\d{2}-\d{2} \d{2}:\d{2}:\d{2}', l)]
              window = f"{stamps[0]} .. {stamps[-1]}" if stamps else "unknown"
              fatals = list(FATAL.finditer(raw))
              procs = []
              for m in fatals:
                  pm = re.search(r'Process:\s*([\w.]+)', m.group(1))
                  procs.append(pm.group(1) if pm else '?')
              print(f"::notice::logcat-summary: {path} lines={len(lines)} window={window} "
                    f"fatal_blocks={len(fatals)} crashed_processes={','.join(procs) or 'none'}")
              shown = 0
              for m in fatals:
                  if 'mushrea' not in m.group(0).lower():
                      continue
                  shown += 1
                  flat = ' | '.join(m.group(1).split())
                  print(f"::error::app-crash: {' '.join(m.group(0).split())[:150]} :: {flat[:1800]}")
                  if shown >= 2:
                      break
              if shown == 0 and fatals:
                  print(f"::notice::no-app-crash: {len(fatals)} crash block(s) in this window, "
                        f"none of them in com.mushrea.code")
              for line in lines:
                  if re.search(r'Fatal signal|signal \d+ \(SIG|SIGSEGV|SIGABRT|\*\*\* \*\*\*|tombstone', line):
                      print(f"::error::native-signal: {' '.join(line.split())[:280]}")
                      break
              died = [l for l in lines
                      if 'mushrea' in l.lower()
                      and re.search(r'\bdied\b|\bKilling\b|ANR in|Force finishing|has died|lowmemorykiller|am_kill|Fatal signal', l, re.I)]
              for line in died[:4]:
                  print(f"::error::process-death: {' '.join(line.split())[:280]}")

          drop = read('/tmp/dropbox.txt')
          if drop.strip():
              blocks = re.split(r'\n(?=\S.{0,80}Drop box entry)', drop)
              hits = [b for b in blocks if 'mushrea' in b.lower()]
              print(f"::notice::dropbox: {len(blocks)} entry block(s), {len(hits)} mention the app")
              for block in hits[:2]:
                  flat = ' | '.join(block.split())
                  print(f"::error::dropbox-entry: {flat[:1600]}")
          else:
              print("::notice::dropbox: no dropbox output was captured")
          PY

      # The ANR trace gets its own step because GitHub keeps at most ten annotations per step.
      # It is the answer to the question the crash step could not answer: the app is not
      # crashing, it is being killed for not responding, and only the trace says what it was
      # doing while it was not responding.
      - name: Surface the ANR trace
        if: always()
        run: |
          python3 - <<'PY'
          import re

          try:
              with open('/tmp/lastanr.txt', encoding='utf-8', errors='replace') as handle:
                  anr = handle.read()
          except Exception as exc:
              anr = ''
              print(f"::notice::anr-trace: could not be read: {exc}")
          if not anr.strip():
              print("::notice::anr-trace: no ANR trace was captured")
          else:
              clean = []
              for line in anr.splitlines():
                  line = re.sub(r'[\x00-\x08\x0b\x0c\x0e-\x1f]', ' ', line)
                  line = line.replace('%', ' percent ').rstrip()
                  if line.strip():
                      clean.append(line.strip())
              print(f"::notice::anr-trace: {len(clean)} line(s) in the last ANR trace")
              for line in clean[:4]:
                  print(f"::notice::anr-head: {line[:240]}")
              # The trace is a thread dump: the first "at ..." frames belong to the main thread.
              frames = [l for l in clean if l.startswith('at ')][:5]
              for line in frames:
                  print(f"::notice::anr-frame: {line[:240]}")
          PY

      # The ANR evidence is carried as gzip+base64. A workflow command message is one line and
      # the command parser drops a message carrying a stray percent sign or a control
      # character - and an ANR trace is full of both. Base64 passes through safely, gzip keeps
      # it inside the ten-annotation budget, and whoever reads the annotation decodes it back.
      #
      # The whole logcat is not carried: it is two megabytes, gzip and base64 still need ninety
      # annotations for it, and GitHub keeps ten per step. What is carried is the part that
      # answers the question - the ANR trace, the dropbox entry, and the logcat lines that
      # mention the app - and the complete capture goes to the artifact instead.
      - name: Carry the ANR evidence
        if: always()
        run: |
          python3 - <<'PY'
          import re
          raw = ''
          try:
              with open('/tmp/logcat.txt', encoding='utf-8', errors='replace') as handle:
                  raw = handle.read()
          except Exception:
              pass
          keep = []
          pattern = re.compile(r'ANR|am_anr|am_kill|Reason:|Subject:|Input dispatching|Service Timeout|Broadcast Timeout|CPU usage|mushrea', re.I)
          for line in raw.splitlines():
              if pattern.search(line):
                  keep.append(line)
          # The last lines matter most: the ANR is reported at the end of the window.
              with open('/tmp/anr-lines.txt', 'w', encoding='utf-8', errors='replace') as handle:
                  handle.write('\n'.join(keep[-400:]))
          print(f"::notice::anr-lines: {len(keep)} matching line(s) in the logcat, {min(len(keep), 400)} carried")
          try:
              with open('/tmp/dropbox.txt', encoding='utf-8', errors='replace') as handle:
                  drop = handle.read()
              # A dropbox entry starts with its own timestamp line. Splitting on that is what
              # makes the app's entry separable from the eighty other entries the emulator
              # writes - the whole dump is a megabyte and a half, and the ten-annotation
              # budget cannot carry it.
              blocks = re.split(r'(?m)(?=^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2} \S+)', drop)
              hits = [b for b in blocks if 'mushrea' in b.lower()]
              with open('/tmp/dropbox-app.txt', 'w', encoding='utf-8', errors='replace') as handle:
                  handle.write('\n'.join(hits))
              print(f"::notice::dropbox-app: {len(blocks)} entry block(s) in the dump, "
                    f"{len(hits)} mention the app")
              for block in hits[:2]:
                  first = [l for l in block.splitlines() if l.strip()][:2]
                  for line in first:
                      print(f"::notice::dropbox-entry: {line[:200]}")
          except Exception as exc:
              print(f"::notice::dropbox-app: could not be read: {exc}")
          PY
          for f in /tmp/lastanr.txt /tmp/dropbox-app.txt /tmp/anr-lines.txt /tmp/settle.txt /tmp/compile.txt; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            size=$(wc -c < "$f")
            echo "::notice::raw-size: $name $size bytes"
            # The trace is capped so that gzip and base64 stay inside the ten-annotation
            # budget. The main thread's stack is at the top of the dump, so the head is the
            # part that answers the question; the whole file is in the artifact.
            head -c 60000 "$f" | gzip -c 2>/dev/null | base64 -w0 | fold -w 3000 | while IFS= read -r chunk; do
              echo "::notice::raw-b64: $chunk"
            done
          done

      # The counts come first. GitHub keeps at most ten annotations per step, and the
      # summary used to be printed last, after one line per test case - so the one number
      # that answers the question was the first thing to be thrown away. The summary is
      # printed first now, the failures next with the message that says why, and the raw
      # report is carried in a step of its own so nothing is lost to the budget.
      - name: Surface the test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re
          import xml.etree.ElementTree as ET

          xmls = sorted(set(
              glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True)
              + glob.glob('app/build/reports/androidTests/**/*.xml', recursive=True)
          ))
          total = failed = skipped = passed = 0
          problems = []
          names = []
          for f in xmls:
              try:
                  raw = open(f, encoding='utf-8', errors='replace').read()
              except Exception as exc:
                  print(f"::warning::test-report: {f} could not be read: {exc}")
                  continue
              try:
                  root = ET.parse(f).getroot()
              except Exception as exc:
                  print(f"::warning::test-report: {f} could not be parsed: {exc}")
                  continue
              suites = [root] if root.tag == 'testsuite' else list(root.iter('testsuite'))
              for suite in suites:
                  for case in suite.iter('testcase'):
                      total += 1
                      cls = case.get('classname') or ''
                      nm = case.get('name') or ''
                      names.append(f"{cls.split('.')[-1]}.{nm}")
                      bad = case.find('failure') if case.find('failure') is not None else case.find('error')
                      if bad is not None:
                          failed += 1
                          text = (bad.get('message') or bad.text or '').strip().splitlines()
                          first = ' | '.join(text[:4]) if text else (bad.get('type') or 'failure')
                          problems.append((cls, nm, first[:400]))
                      elif case.find('skipped') is not None:
                          skipped += 1
                      else:
                          passed += 1
          print(f"::notice::tests: {total} test(s) executed, {passed} passed, {failed} failed, "
                f"{skipped} skipped, {len(xmls)} xml report file(s)")
          for cls, nm, why in problems[:8]:
              print(f"::error::test-failed: {cls} :: {nm} :: {why}")
          if len(problems) > 8:
              print(f"::notice::test-failed: {len(problems) - 8} further failure(s) in the report file")
          if names:
              print(f"::notice::test-names: {'; '.join(names)[:2200]}")

          # The Android Gradle plugin's HTML report carries the per-test status too, and it
          # survives a report file whose name contains a space - which the XML file's name
          # does. Only the failures are printed: the step's ten annotations are worth more
          # spent on what went wrong than on a list of what went right.
          for h in sorted(set(glob.glob('app/build/reports/androidTests/**/*.html', recursive=True))):
              try:
                  s = open(h, encoding='utf-8', errors='replace').read()
              except Exception as exc:
                  print(f"::warning::test-report: {h} could not be read: {exc}")
                  continue
              for m in re.finditer(r'data-spec="([^"]*)"[^>]*?data-status="([^"]*)"', s):
                  spec, status = m.group(1), m.group(2)
                  if status in ('failed', 'error'):
                      print(f"::error::test-status: {status} :: {spec[:200]}")
              for m in list(re.finditer(r'<pre class="stacktrace">(.{0,400}?)</pre>', s, re.S))[:4]:
                  print(f"::notice::test-stacktrace: {' '.join(m.group(1).split())[:300]}")
          PY

      # The raw report is carried as gzip+base64: a workflow command message is one line and
      # the command parser drops a message carrying a stray percent sign or a control
      # character, and an XML report carries both.
      - name: Carry the device report
        if: always()
        run: |
          # The report file's name contains a space, so the file list is read with a null
          # separator: a plain word split broke the name and nothing was carried at all.
          find app/build/outputs/androidTest-results app/build/reports/androidTests \
            \( -name '*.xml' -o -name '*.html' \) -print0 2>/dev/null | while IFS= read -r -d '' f; do
            echo "::notice::raw-size: $f $(wc -c < "$f") bytes"
            gzip -c "$f" 2>/dev/null | base64 -w0 | fold -w 3000 | while IFS= read -r chunk; do
              echo "::notice::raw-b64: $chunk"
            done
          done

      - name: Upload the instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-report-${{ matrix.flavor }}
          path: |
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
            /tmp/instrumented.log
            /tmp/logcat.txt
            /tmp/logcat-crash.txt
            /tmp/logcat-attempt-*.txt
            /tmp/lastanr.txt
            /tmp/dropbox.txt
          if-no-files-found: ignore
          retention-days: 14
