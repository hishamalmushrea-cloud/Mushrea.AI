name: Handoff probe (temporary)

# Temporary. It answers one question before a 15-minute signed build is spent on it: can a workflow
# running on this branch push a branch back to the repository, with a binary of realistic size? If it
# can, the signing workflow can hand back a signed APK and an encrypted keystore without anyone
# having to download artifacts by hand. Deleted once it has answered.
on:
  workflow_dispatch:
  push:
    branches: ['arena/01a0f971-mushrea-ai']
    paths: ['.handoff-probe']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build a blob and push it to its own branch
        run: |
          set -euo pipefail
          BRANCH="handoff-probe-${{ github.run_number }}"
          head -c 15000000 /dev/urandom > blob.bin
          SHA="$(sha256sum blob.bin | awk '{print $1}')"
          echo "probe branch: $BRANCH"
          echo "blob sha256: $SHA"
          {
            echo "## Handoff probe"
            echo ""
            echo "- branch: \`$BRANCH\`"
            echo "- blob: 15,000,000 bytes of urandom"
            echo "- sha256: \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$BRANCH" > /tmp/branch.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add blob.bin
          git commit -m "chore(handoff): probe push of a 15 MB binary"
          git push origin "$BRANCH"
