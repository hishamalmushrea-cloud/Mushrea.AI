# Temporary verification workflow for the session branch.
#
# `Android CI` deliberately gates its heavy jobs to `main` and pull requests, and the session app
# has no `actions: write` to dispatch that workflow manually, so the branch has been running with
# auto-format only. This file runs the same heavy jobs ungated on this branch so the work has real
# build/test/lint evidence. Remove it once the evidence is captured — it is not part of the
# product's CI policy. See docs/development/DEVELOPMENT_LOG.md (Phase 2, CI reality row).
name: Branch Verification

on:
  push:
    branches: ['arena/01a0f971-mushrea-ai']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Upstream pruned the .deb versions pinned in runtime_tools/termux_assets.lock.json, so every
  # mirror 404s them and any build that prepares the runtime assets fails. The repository's own
  # tooling re-resolves the pins from the current Termux index; the refreshed lock is uploaded so
  # it can be committed, and the three build jobs below use exactly that file.
  lock-refresh:
    name: refresh the pinned Termux package lock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Re-resolve the pins from the Termux package index
        run: python3 scripts/prepare_android_runtime_assets.py --output-dir /tmp/lock-refresh --lock-only

      - name: Show what changed
        run: git --no-pager diff --stat runtime_tools/termux_assets.lock.json

      # Same pattern as the auto-format job: the run commits its own fix so the refreshed pins
      # become reviewable and the next run builds from the committed file.
      - name: Commit and push the refreshed lock
        run: |
          if git diff --quiet -- runtime_tools/termux_assets.lock.json; then
            echo "lock already current"
            exit 0
          fi
          git config user.name "mushrea-ci"
          git config user.email "actions@users.noreply.github.com"
          git add runtime_tools/termux_assets.lock.json
          git commit -m "fix(build): refresh the pinned Termux package versions"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin HEAD; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::could not push the refreshed lock"
          exit 1

  static-analysis:
    name: static analysis (detekt + spotless + checkers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Architecture layer rules
        run: python3 scripts/check_architecture.py

      - name: Tool catalog rules
        run: python3 scripts/check_tool_catalog.py

      - name: Permission hook behaviour
        run: python3 scripts/check_permission_hook.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Detekt + spotless
        run: ./gradlew detekt spotlessCheck

      - name: Surface detekt or spotless findings
        if: failure()
        run: |
          ./gradlew detekt spotlessCheck >/tmp/sa.log 2>&1 || true
          grep -E "^e: |What went wrong|Caused by|Not a valid Kotlin|Error on line" /tmp/sa.log | head -20 | while IFS= read -r line; do
            echo "::error::sa: $line"
          done

  lint:
    needs: lock-refresh
    name: android lint (githubDebug)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The lock-refresh job may have just pushed a refreshed pin file; build what the
          # branch now says rather than the older commit that triggered this run.
          ref: ${{ github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache generated Android runtime
        uses: actions/cache@v4
        with:
          path: |
            build/generated/runtime-assets
            build/generated/runtime-jni
          key: mushrea-code-runtime-${{ runner.os }}-${{ hashFiles('runtime_tools/termux_assets.lock.json', 'runtime_tools/termux_assets.py', 'scripts/prepare_android_runtime_*.py') }}

      - name: Lint
        run: ./gradlew :app:lintGithubDebug

      - name: Surface lint findings
        if: failure()
        run: |
          ./gradlew :app:lintGithubDebug > /tmp/lint.log 2>&1 || true
          grep -E "Error:|^e: |error: |What went wrong|Execution failed for task" /tmp/lint.log | head -30 | while IFS= read -r line; do
            echo "::error::lint: $line"
          done
          tail -25 /tmp/lint.log | while IFS= read -r line; do
            echo "::error::lint-tail: $line"
          done

  unit-tests-and-debug:
    needs: lock-refresh
    name: unit tests + debug APK + instrumentation compile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The lock-refresh job may have just pushed a refreshed pin file; build what the
          # branch now says rather than the older commit that triggered this run.
          ref: ${{ github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache generated Android runtime
        uses: actions/cache@v4
        with:
          path: |
            build/generated/runtime-assets
            build/generated/runtime-jni
          key: mushrea-code-runtime-${{ runner.os }}-${{ hashFiles('runtime_tools/termux_assets.lock.json', 'runtime_tools/termux_assets.py', 'scripts/prepare_android_runtime_*.py') }}

      - name: Validate runtime build scripts
        run: |
          python -m py_compile \
            runtime_tools/termux_assets.py \
            scripts/prepare_android_runtime_assets.py \
            scripts/prepare_android_runtime_native_libs.py
          python scripts/prepare_android_runtime_assets.py --help >/dev/null

      - name: Test and build debug APK
        env:
          GITHUB_CLIENT_ID: ${{ vars.AND_CODE_GITHUB_CLIENT_ID }}
        run: ./gradlew :app:testGithubDebugUnitTest :app:assembleGithubDebug :app:assembleGithubDebugAndroidTest

      - name: Surface compile or test failures
        if: failure()
        run: |
          # Re-run exactly the tasks the failing step runs, so the diagnostics cover test
          # execution and the instrumentation compile as well as the main sources.
          ./gradlew :app:testGithubDebugUnitTest :app:assembleGithubDebug :app:assembleGithubDebugAndroidTest --continue > /tmp/build.log 2>&1 || true
          grep -E "^e: file://|^e: " /tmp/build.log | head -30 | while IFS= read -r line; do echo "::error::compile: $line"; done
          grep -E "FAILED|Execution failed for task|Could not |Unresolved |error: " /tmp/build.log | head -30 | while IFS= read -r line; do echo "::error::gradle: $line"; done
          found=0
          for f in $(find . -path "*build/test-results*" -name "TEST-*.xml" 2>/dev/null); do
            if grep -q "<failure\|<error" "$f"; then
              found=1
              grep -o '<testcase name="[^"]*"' "$f" | head -5 | while IFS= read -r tc; do echo "::error::testcase: $tc"; done
              grep -o '<failure[^>]*' "$f" | head -3 | while IFS= read -r m; do echo "::error::test-failure: $m"; done
              grep -o '<error[^>]*' "$f" | head -3 | while IFS= read -r m; do echo "::error::test-error: $m"; done
            fi
          done
          if [ "$found" = "0" ]; then
            tail -40 /tmp/build.log | while IFS= read -r line; do echo "::error::tail: $line"; done
          fi

      - name: Unit test report summary
        if: always()
        run: |
          total=0; failed=0
          for f in $(find . -path "*build/test-results*" -name "TEST-*.xml" 2>/dev/null); do
            t=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | tr -dc '0-9'); f2=$(grep -o 'failures="[0-9]*"' "$f" | head -1 | tr -dc '0-9')
            total=$((total + ${t:-0})); failed=$((failed + ${f2:-0}))
          done
          echo "unit tests: $total run, $failed failed"
          if [ "$failed" != "0" ]; then echo "::error::unit tests: $failed of $total failed"; fi
          {
            echo "### Unit tests"
            echo "- run: $total"
            echo "- failed: $failed"
          } >> "$GITHUB_STEP_SUMMARY"

  release-r8:
    needs: lock-refresh
    name: release APK (R8 minified)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The lock-refresh job may have just pushed a refreshed pin file; build what the
          # branch now says rather than the older commit that triggered this run.
          ref: ${{ github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache generated Android runtime
        uses: actions/cache@v4
        with:
          path: |
            build/generated/runtime-assets
            build/generated/runtime-jni
          key: mushrea-code-runtime-${{ runner.os }}-${{ hashFiles('runtime_tools/termux_assets.lock.json', 'runtime_tools/termux_assets.py', 'scripts/prepare_android_runtime_*.py') }}

      - name: Build release APK
        env:
          GITHUB_CLIENT_ID: ${{ vars.AND_CODE_GITHUB_CLIENT_ID }}
        run: ./gradlew :app:assembleGithubRelease

      - name: Surface release build failures
        if: failure()
        run: |
          ./gradlew :app:assembleGithubRelease > /tmp/release.log 2>&1 || true
          grep -E "Missing class|ERROR:|error: |What went wrong|Execution failed for task|Caused by|not found" /tmp/release.log | head -30 | while IFS= read -r line; do
            echo "::error::release: $line"
          done
          tail -25 /tmp/release.log | while IFS= read -r line; do
            echo "::error::release-tail: $line"
          done
          ./gradlew :app:dependencies --configuration githubReleaseRuntimeClasspath > /tmp/deps.log 2>&1 || true
          grep -i -B4 "appcompat" /tmp/deps.log | head -24 | while IFS= read -r line; do
            echo "::warning::dep: $line"
          done
