name: Bootstrap F-Droid binary repository (one-shot)

# Deploys the already-signed F-Droid binary repo to GitHub Pages.
# The repository key was generated in run 37211908757 and must not be minted again.
on:
  push:
    branches: ['arena/01a1073e-mushrea-ai']
    paths: ['.publish-fdroid-repo-request']

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: mushrea-fdroid-repo-bootstrap
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/arena/01a1073e-mushrea-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the sealed repo identity
        run: |
          set -euo pipefail
          grep -qx 'publish: fdroid-binary-repo' .publish-fdroid-repo-request
          test -s .signing-handoff/fdroid-repo-identity.cms

      - name: Restore the signed repository from the bootstrap artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p fdroid
          gh run download 37211908757 \
            --repo "$GITHUB_REPOSITORY" \
            --name fdroid-repo \
            --dir fdroid/repo
          test -s fdroid/repo/mushrea-code-v1.2.26-fdroid-release.apk
          test -e fdroid/repo/index-v1.jar -o -e fdroid/repo/index.xml

      - name: Prepare Pages site
        run: |
          set -euo pipefail
          mkdir -p site/fdroid
          cp -a pages/. site/
          cp -a fdroid/repo site/fdroid/repo
          touch site/.nojekyll
          test -s site/index.html
          test -s site/fdroid/repo/index.xml

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
