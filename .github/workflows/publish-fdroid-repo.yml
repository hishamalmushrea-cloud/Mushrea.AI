name: Bootstrap F-Droid binary repository (one-shot)

# Publishes the already-signed F-Droid repo tree onto this session branch so
# clients can fetch it without GitHub Pages. Pages deploy is best-effort: the
# Actions token cannot enable Pages (403).
on:
  push:
    branches: ['arena/01a1073e-mushrea-ai']
    paths: ['.publish-fdroid-repo-request']

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: mushrea-fdroid-repo-bootstrap
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/arena/01a1073e-mushrea-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the sealed repo identity
        run: |
          set -euo pipefail
          grep -qx 'publish: fdroid-binary-repo' .publish-fdroid-repo-request
          test -s .signing-handoff/fdroid-repo-identity.cms

      - name: Restore the signed repository from the bootstrap artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p fdroid
          gh run download 37211908757 \
            --repo "$GITHUB_REPOSITORY" \
            --name fdroid-repo \
            --dir fdroid/repo
          test -s fdroid/repo/mushrea-code-v1.2.26-fdroid-release.apk
          test -e fdroid/repo/index-v1.jar -o -e fdroid/repo/index.xml

      - name: Publish the repository tree on this session branch
        run: |
          set -euo pipefail
          BRANCH='arena/01a1073e-mushrea-ai'
          git fetch origin "$BRANCH"
          git merge --ff-only FETCH_HEAD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # APKs are gitignored; the F-Droid client needs them next to the index.
          git add -f -- fdroid/repo pages/index.html
          git diff --cached --quiet && echo 'no tree change' && exit 0
          git commit -m "ci(fdroid): publish the signed binary repository tree for run $GITHUB_RUN_ID"
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Prepare Pages site
        run: |
          set -euo pipefail
          mkdir -p site
          cp -a pages/. site/
          mkdir -p site/fdroid
          cp -a fdroid/repo site/fdroid/repo

      - name: Configure GitHub Pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
